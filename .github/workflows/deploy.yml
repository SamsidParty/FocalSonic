name: Deploy ClickOnce

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FocalSonic/src-vite
    
    permissions:
      contents: write
      pages: write
      id-token: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Updater

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
